[project]
name = "nightcrawler"
version = "0.1.0"
description = "Telescope imaging sequence planner and capture controller"
requires-python = ">=3.11"
dependencies = [
    "nicegui>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "astropy>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
render = [
    "scipy>=1.11",
    "astroalign>=2.6",
    "colour-demosaicing>=0.2",
    "Pillow>=10.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "nightcrawler[render]",
]

[project.scripts]
nightcrawler = "src.main:main"
nightcrawler-render = "src.renderer.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["astropy.*", "numpy.*", "nicegui.*"]
ignore_missing_imports = true

[tool.uv]
# Experiment for issue #107: suppress orjson so NiceGUI falls back to its
# stdlib-json wrapper (json/builtin_wrapper.py). Required to make a free-
# threaded Python (3.13t) install feasible — orjson does not yet support PEP
# 703 free-threading and the maintainer targets CPython 3.15 only.
# The marker `sys_platform == 'never'` evaluates to false on every platform,
# so uv excludes orjson from dependency resolution entirely.
override-dependencies = ["orjson ; sys_platform == 'never'"]
